name: iOS tests on a simulator, with an executed-count assertion
description: >-
  Build and test an Xcode scheme on an iOS Simulator, then assert that tests actually executed.
  Needs no Apple Developer account and no code signing, because simulator builds require neither --
  which is what makes this lane free to run in CI.

inputs:
  working-directory:
    description: Directory containing the Xcode project or workspace.
    required: true
  scheme:
    description: Scheme to test.
    required: true
  project:
    description: Path to the .xcodeproj, relative to working-directory. Mutually exclusive with workspace.
    required: false
    default: ""
  workspace:
    description: Path to the .xcworkspace, relative to working-directory. Mutually exclusive with project.
    required: false
    default: ""
  simulator:
    description: >-
      Simulator device name. There is no safe default across runner images -- an image ships whichever
      simulators it ships -- so pass one you have confirmed exists on your runner.
    required: false
    default: "iPhone 17"
  scheme-path:
    description: >-
      Path to the shared .xcscheme, relative to working-directory, e.g.
      `App.xcodeproj/xcshareddata/xcschemes/App.xcscheme`. When set, the scheme is asserted to have an
      enabled testable BEFORE the build -- the two static causes of a zero-test run cost milliseconds
      to rule out and minutes to discover from a build. Leave empty to skip that check.
    required: false
    default: ""
  source-dirs:
    description: >-
      Space-separated source directories, relative to working-directory. When set, every source file
      found in them is asserted to be in a Sources build phase -- catching a file that exists, was
      reviewed, and is not compiled. Requires `project`. Leave empty to skip.
    required: false
    default: ""
  xcodegen-spec:
    description: >-
      If set, run `xcodegen generate` with this spec before building. For projects whose .xcodeproj is
      generated and gitignored rather than tracked.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install XcodeGen
      if: ${{ inputs.xcodegen-spec != '' }}
      shell: bash
      run: brew install xcodegen

    - name: Generate the Xcode project
      if: ${{ inputs.xcodegen-spec != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: xcodegen generate --spec '${{ inputs.xcodegen-spec }}'

    # BEFORE the build, because both causes are static facts in the .xcscheme and a build costs
    # minutes to tell you the same thing. Skipped when `scheme-path` is not supplied, since a
    # generated project's scheme does not exist until after xcodegen runs -- in that case the path is
    # under the generated .xcodeproj and the caller knows it.
    - name: Assert the scheme will run tests
      if: ${{ inputs.scheme-path != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK: ${{ github.action_path }}/../../../bin/ios_scheme_check
      run: |
        set -euo pipefail
        if [ ! -x "$CHECK" ]; then
          printf 'error: guard not found or not executable at %s\n' "$CHECK" >&2
          exit 1
        fi
        "$CHECK" '${{ inputs.scheme-path }}'

    # Also before the build, and for the same reason: a file that is not in a Sources phase is a
    # static fact. This is the one false-green mechanism neither other guard can see -- the scheme is
    # valid, and the executed count is non-zero because the OTHER tests ran.
    - name: Assert every source file is compiled
      if: ${{ inputs.source-dirs != '' && inputs.project != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK: ${{ github.action_path }}/../../../bin/ios_target_membership_check
      run: |
        set -euo pipefail
        if [ ! -x "$CHECK" ]; then
          printf 'error: guard not found or not executable at %s\n' "$CHECK" >&2
          exit 1
        fi
        # Deliberately unquoted: source-dirs is a space-separated list and word splitting is how the
        # arguments are delivered.
        # shellcheck disable=SC2086
        "$CHECK" '${{ inputs.project }}/project.pbxproj' ${{ inputs.source-dirs }}

    # Boot the simulator via the shared script rather than inline `simctl`, so the prep is readable,
    # copyable and exercised the same way the Android side is. It also prints what the image actually
    # ships when the name is wrong -- an unknown device otherwise surfaces as a `-destination` error,
    # which reads like a malformed destination string.
    - name: Boot the simulator
      shell: bash
      env:
        PREPARE: ${{ github.action_path }}/../../../bin/gha_prepare_ios_simulator
      run: |
        set -euo pipefail
        if [ ! -x "$PREPARE" ]; then
          printf 'error: %s not found or not executable\n' "$PREPARE" >&2
          exit 1
        fi
        "$PREPARE" '${{ inputs.simulator }}'

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET_FLAG: ${{ inputs.project != '' && format('-project {0}', inputs.project) || format('-workspace {0}', inputs.workspace) }}
      run: |
        set -euo pipefail
        if [ -z '${{ inputs.project }}' ] && [ -z '${{ inputs.workspace }}' ]; then
          printf 'error: pass exactly one of `project` or `workspace`\n' >&2
          exit 1
        fi
        if [ -n '${{ inputs.project }}' ] && [ -n '${{ inputs.workspace }}' ]; then
          printf 'error: `project` and `workspace` are mutually exclusive\n' >&2
          exit 1
        fi
        # `-resultBundlePath` is what makes the assertion below possible at all. Without it there is
        # no .xcresult to read a count out of, and the only signal left is xcodebuild's exit code --
        # which is 0 for a run that executed nothing.
        #
        # NOTE: xcodebuild's own output is deliberately not piped through a formatter here. A pipeline
        # would mask xcodebuild's exit status unless `pipefail` is set, and this repo has been bitten
        # by exactly that shape elsewhere; `set -o pipefail` above is what makes it safe.
        # shellcheck disable=SC2086
        xcodebuild test \
          $TARGET_FLAG \
          -scheme '${{ inputs.scheme }}' \
          -destination 'platform=iOS Simulator,name=${{ inputs.simulator }}' \
          -resultBundlePath build/result.xcresult \
          -derivedDataPath build/dd \
          CODE_SIGNING_ALLOWED=NO

    # THE POINT OF THIS ACTION. `xcodebuild test` can print a suite tree in which every line says
    # `passed` while having executed zero tests, and it emits no `** TEST FAILED **` in that state.
    # Without this step the lane is green and verifies nothing.
    - name: Assert tests actually executed
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK: ${{ github.action_path }}/../../../bin/ios_test_result_check
      run: |
        set -euo pipefail
        if [ ! -x "$CHECK" ]; then
          printf 'error: guard not found or not executable at %s\n' "$CHECK" >&2
          exit 1
        fi
        "$CHECK" build/result.xcresult

    - name: Upload the result bundle
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ios-xcresult-${{ inputs.scheme }}
        path: ${{ inputs.working-directory }}/build/result.xcresult
        if-no-files-found: ignore
        retention-days: 7
