name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: cancel the older run rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Script syntax and regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Every shipped script must parse under a real POSIX sh. Note this runner's `sh` is dash,
      # while macOS `sh` is bash in POSIX mode and accepts bashisms dash rejects -- so a script
      # validated only on macOS is not validated for the shell it claims.
      - name: Syntax-check every script under sh
        run: |
          set -eu
          found=0
          for f in bin/* tests/*; do
            [ -f "$f" ] || continue
            printf 'sh -n %s\n' "$f"
            sh -n "$f"
            found=$((found + 1))
          done
          # A loop over a glob that matched nothing exits 0 and looks identical to a clean pass.
          if [ "$found" -eq 0 ]; then
            printf 'error: no scripts were checked, so this step proved nothing\n' >&2
            exit 1
          fi
          printf 'syntax-checked %d script(s)\n' "$found"

      # The suite drives --summary-json, so it needs no Xcode and runs here rather than on a macOS
      # runner. Same parse and same assertions as the .xcresult path.
      - name: Regression suites for every guard
        run: |
          set -eu
          tests/ios_scheme_check_test
          tests/ios_target_membership_check_test
          tests/ios_test_result_check_test
          tests/android_test_result_check_test

  lint:
    name: shellcheck ${{ matrix.shellcheck }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Two PINNED versions, both required. The scripts here are meant to be copied into other
        # repos, so "clean under shellcheck" is a claim about more than one version -- and an
        # untested compatibility claim is exactly the kind this repo exists to argue against.
        #
        # These two specifically: 0.9.0 is what Ubuntu 24.04's apt ships, and 0.11.0 is current.
        # They disagree about the same code -- 0.9.0 reports SC2317 on a trap-invoked function's
        # body, 0.11.0 reports SC2329 on its declaration -- so a `# shellcheck disable=` directive
        # naming only one ID passes on one version and fails on the other. That is a real CI failure
        # this repo hit on its first push, and the reason the version is pinned rather than apt's.
        shellcheck: [v0.9.0, v0.11.0]
    steps:
      - uses: actions/checkout@v6

      - name: Run shellcheck ${{ matrix.shellcheck }}
        env:
          SHELLCHECK_VERSION: ${{ matrix.shellcheck }}
        run: |
          set -eu
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$tmp"
          sc="$tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          # Assert the pin took effect. Without this, a moved release URL or a changed archive layout
          # would leave `$sc` missing or fall back to some other binary, and the step could pass while
          # linting with a version nobody chose -- or while linting nothing at all.
          "$sc" --version
          "$sc" --version | grep -qx "version: ${SHELLCHECK_VERSION#v}" || {
            printf 'error: expected shellcheck %s\n' "${SHELLCHECK_VERSION#v}" >&2
            exit 1
          }
          "$sc" --shell=sh bin/* tests/*

  awk-portability:
    name: awk portability (${{ matrix.awk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Both required. The two guards in bin/ parse with awk, and awk implementations genuinely
        # differ -- this matrix is not ceremony. Measured while building it: injecting gawk's
        # `gensub()` into one guard turns the mawk leg RED while the gawk leg stays GREEN on identical
        # code. That divergence is the whole justification.
        #
        # Why it matters beyond this repo: macOS ships one-true-awk (BSD), Debian/Ubuntu's /usr/bin/awk
        # is mawk, and mawk's ERE interval-quantifier support (`{n,m}`) cannot be relied on. A check
        # script written and validated on a Mac is UNVALIDATED for the Ubuntu runner that enforces it,
        # and the failure can be a silent "matched nothing" rather than an error.
        #
        # A third implementation is already covered without a job: the ios-xctest lane runs on macOS,
        # so BSD awk is exercised there. busybox awk is deliberately NOT a leg -- there is no brew
        # formula, so it cannot be dry-run locally, and a gate whose first execution is in CI is how
        # this repo's shellcheck-version bug got in.
        awk: [mawk, gawk]
    steps:
      - uses: actions/checkout@v6

      - name: Install ${{ matrix.awk }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.awk }}

      # A shim directory rather than `update-alternatives`, and rather than threading an $AWK variable
      # through the guards: production scripts should not carry a seam that exists only for their own
      # tests. The scripts call `awk` bare; PATH decides which one that is.
      - name: Run both guard suites under ${{ matrix.awk }}
        run: |
          set -euo pipefail
          shim="$(mktemp -d)"
          ln -s "$(command -v ${{ matrix.awk }})" "$shim/awk"
          export PATH="$shim:$PATH"

          # ASSERT THE SHIM TOOK EFFECT. Without this the job passes while running the runner's
          # default awk, reporting coverage of an implementation it never used -- the same shape as
          # the unpinned-linter bug recorded in the README trap index.
          actual="$(awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1)"
          printf 'awk in use: %s\n' "$actual"
          case "${{ matrix.awk }}" in
            mawk) printf '%s' "$actual" | grep -q '^mawk' ;;
            gawk) printf '%s' "$actual" | grep -q '^GNU Awk' ;;
          esac || {
            printf 'error: PATH shim did not take effect; got %s\n' "$actual" >&2
            exit 1
          }

          tests/ios_scheme_check_test
          tests/ios_target_membership_check_test
          tests/ios_test_result_check_test
          tests/android_test_result_check_test

  android:
    name: Android instrumentation on an emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    # The emulator lane is the expensive one, so it does not start until the cheap jobs are green.
    # `lint` and `scripts` finish in well under a minute, so listing them costs no wall-clock and
    # stops an emulator ever booting for a verdict that is already decided.
    needs: [scripts, lint]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [36]
    steps:
      - uses: actions/checkout@v6

      # This is the repo dogfooding its own action. An external consumer writes
      #   uses: fruitiecutiepie/mobile-ci-kit/.github/actions/android-emulator-test@main
      # instead of the local path.
      - name: Run instrumentation tests on an emulator
        uses: ./.github/actions/android-emulator-test
        with:
          working-directory: examples/minimal-android
          api-level: ${{ matrix.api-level }}

  e2e-contract:
    name: Provider contract and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      # Device-free and milliseconds: no Appium, no emulator, no network. This is the executable
      # definition of what a device-farm provider must satisfy, which is why this repo ships no stub
      # farm provider -- see docs/appium-portability.md.
      - name: Provider contract
        working-directory: e2e
        run: npm run test:contract

      # The portability claim, asserted rather than described. If a vendor string or a platform
      # branch appears in a spec or screen object, the boundary has leaked and this fails.
      - name: Assert the suite stays provider-agnostic
        run: |
          set -euo pipefail
          leaks=0

          # Comment lines are excluded, because this repo's own specs DISCUSS the things the check
          # forbids -- the spec explains why `driver.isAndroid` would be a red flag, and that sentence
          # tripped the check on its first run. The filter is a deliberate heuristic (leading `*`,
          # `//` or `/*`), not a TypeScript parse: it is worth stating that a `platformName` inside a
          # multi-line string would slip through, and that this is a nudge rather than a proof.
          code_only() {
            grep -rniE "$1" e2e/specs e2e/screens | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' || true
          }

          # Vendor namespaces and app-identifier schemes belong to a provider, never to a spec.
          vendor="$(code_only 'bstack:|sauce:|lambdatest|browserstack|bs://|testmu')"
          if [ -n "$vendor" ]; then
            printf 'error: a vendor reference leaked into specs/screens:\n%s\n' "$vendor" >&2
            leaks=1
          fi

          # Platform branching in a spec means the accessibility ids stopped being the contract.
          branching="$(code_only 'isAndroid|isIOS|isIos|platformName')"
          if [ -n "$branching" ]; then
            printf 'error: platform branching leaked into specs/screens:\n%s\n' "$branching" >&2
            leaks=1
          fi
          # A grep that matches nothing exits 1 and looks identical to a clean pass, so prove the
          # files were actually searched.
          searched=$(find e2e/specs e2e/screens -name '*.ts' | wc -l | tr -d ' ')
          if [ "$searched" -eq 0 ]; then
            printf 'error: no spec or screen files were searched, so this step proved nothing\n' >&2
            exit 1
          fi
          printf 'searched %s spec/screen file(s), %s leak(s)\n' "$searched" "$leaks"
          exit "$leaks"

  appium-android:
    name: Appium on an Android emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    needs: [scripts, lint, e2e-contract]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [36]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Emulator prerequisites, from the same shared script the instrumentation lane uses.
      - name: Prepare the runner for an emulator
        uses: ./.github/actions/android-emulator-setup

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Build the fixture APK
        working-directory: examples/minimal-android
        run: ./gradlew --no-daemon :app:assembleDebug

      # The Appium server is started and stopped by @wdio/appium-service inside the run, so there is
      # no `appium &` step here and no orphan server if the run fails.
      - name: Run the Appium suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -no-metrics
          working-directory: e2e
          script: npm run test:android

      - name: Upload Appium logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: appium-android-logs-api${{ matrix.api-level }}
          path: |
            e2e/logs/
            e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  ios-xctest:
    name: iOS tests on a simulator
    # macOS runners are billed at a higher multiplier on private repos; on a public repo standard
    # runners are free. The lane needs no Apple Developer account: simulator builds require no code
    # signing, which is the fact that makes an iOS lane viable at all in open CI.
    runs-on: macos-15
    needs: [scripts, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run XCTest on a simulator
        uses: ./.github/actions/ios-xctest
        with:
          working-directory: examples/minimal-ios
          xcodegen-spec: project.yml
          project: Minimal.xcodeproj
          scheme: Minimal
          # xcodegen writes the shared scheme here, so it exists by the time the check runs.
          scheme-path: Minimal.xcodeproj/xcshareddata/xcschemes/Minimal.xcscheme
          source-dirs: Sources Tests
          # macos-15 images ship iPhone 16-era simulators; the prep script prints what is actually
          # available when the name is wrong, so a bad name is one log line away from the right one.
          simulator: iPhone 16

  appium-ios:
    name: Appium on an iOS simulator
    runs-on: macos-15
    needs: [scripts, lint, e2e-contract]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: examples/minimal-ios
        run: xcodegen generate

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # `build`, not `build-for-testing`: the Appium lane drives the app, and the XCTest bundle is
      # the other lane's business.
      - name: Build the app for the simulator
        working-directory: examples/minimal-ios
        run: |
          set -euo pipefail
          xcrun simctl list devices available | sed -n '1,40p'
          xcodebuild build \
            -project Minimal.xcodeproj \
            -scheme Minimal \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO
        env:
          SIMULATOR: iPhone 16

      # Boot it here and pass the udid, rather than letting Appium pick or create a simulator: a
      # pinned, already-booted device is both faster and deterministic. `simctl boot` on an
      # already-booted device is an error, so the state is checked rather than assumed.
      - name: Boot the simulator and export its udid
        env:
          SIMULATOR: iPhone 16
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available \
            | grep -E "^ *$SIMULATOR \(" \
            | grep -oE '[0-9A-F-]{36}' | head -1)"
          if [ -z "$udid" ]; then
            printf 'error: no available simulator named %s on this runner image\n' "$SIMULATOR" >&2
            printf 'the list above is what it actually ships\n' >&2
            exit 1
          fi
          state="$(xcrun simctl list devices | grep "$udid" | grep -oE '\((Booted|Shutdown)\)' || true)"
          if [ "$state" != '(Booted)' ]; then
            xcrun simctl boot "$udid"
          fi
          xcrun simctl bootstatus "$udid" -b
          printf 'IOS_SIMULATOR_UDID=%s\n' "$udid" >> "$GITHUB_ENV"

      # The FIRST XCUITest session builds and installs WebDriverAgent, which takes several minutes on
      # a cold runner. The provider's WDA timeouts are generous for exactly this reason; a short
      # timeout here surfaces as `Request timed out!` and names neither WDA nor the build.
      - name: Run the Appium suite
        working-directory: e2e
        env:
          TARGET_PLATFORM: ios
          APP_PATH: ../examples/minimal-ios/build/dd/Build/Products/Debug-iphonesimulator/Minimal.app
        run: npm run test:android

      - name: Upload Appium logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: appium-ios-logs
          path: |
            e2e/logs/
            e2e/*.log
          if-no-files-found: ignore
          retention-days: 7
